[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cmos-camera-gui"
version = "0.2.0"
description = "Multi-vendor CMOS camera control GUI (ZWO ASI, QHYCCD) — PyQt5 + direct ctypes SDKs, WebSocket remote control"
requires-python = ">=3.10"

dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "websockets>=12.0",
    "astropy>=5.0",
    "ipykernel"
]


[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmos-camera-gui = "cmos_camera_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
